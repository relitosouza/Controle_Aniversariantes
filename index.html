<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Aniversários</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🎂 Gestão de Aniversários</h1>
    </header>

    <div class="tabs">
        <button class="tab-link active" onclick="abrirTab(event, 'tab-cadastro')">📋 Cadastro</button>
        <button class="tab-link" onclick="abrirTab(event, 'tab-pesquisa')">🔍 Pesquisar</button>
        <button class="tab-link" onclick="abrirTab(event, 'tab-relatorio')">📊 Semana</button>
    </div>

    <main>
        
        <section id="tab-cadastro" class="tab-content active">
            <h2>Novo Aniversariante</h2>
            <form id="formCadastro">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" name="nome" placeholder="Ex: Ana Silva" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Data de Nascimento</label>
                        <input type="date" name="data_nascimento" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone</label>
                      <input type="tel" name="telefone" placeholder="(11) 99999-9999" maxlength="15">
                    </div>
                </div>

                <div class="form-group">
                    <label>Endereço</label>
                    <input type="text" name="endereco" placeholder="Rua, Número, Bairro">
                </div>
                
                <div class="form-group">
                    <label>CEP</label>
                    <input type="text" name="cep" placeholder="00000-000">
                </div>

                <button type="submit" class="btn-primary">Salvar Cadastro</button>
            </form>
        </section>

       <section id="tab-pesquisa" class="tab-content">
    <h2>Pesquisar Aniversariante</h2>
    
    <div class="form-group">
        <label>Nome (Opcional)</label>
        <input type="text" id="nomePesquisa" placeholder="Ex: Maria">
    </div>

    <div class="form-group">
        <label>Data (Opcional)</label>
        <input type="date" id="dataPesquisa">
    </div>

    <button class="btn-secondary" id="btnPesquisar" style="margin-top: 10px;">🔍 Buscar</button>

    <div class="resultado" id="resPesquisa" style="margin-top: 20px;">
        <p class="placeholder-text">Os resultados aparecerão aqui...</p>
    </div>
</section>
<section id="tab-relatorio" class="tab-content">
    <h2>Próximos Aniversariantes</h2>
    <p>Veja quem faz aniversário nos próximos 7 dias.</p>
    
    <button class="btn-secondary" id="btnRelatorio">Ver na Tela</button>
    
    <button class="btn-primary" id="btnEnviarEmail" style="margin-top: 10px; background-color: #059669;">📧 Enviar Aviso por Email Agora</button>
    
    <div class="resultado" id="resRelatorio"></div>
</section>

    </main>
</div>

<script src="script.js"></script>

</body>
</html>
