<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aniversários App</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mobile-wrapper">
    
    <header>
        <div class="header-content">
            <div class="icon-bg">
                <i class="ph-fill ph-cake"></i>
            </div>
            <div>
                <h1>Celebra</h1>
                <p>Gerenciador de Aniversarios</p>
            </div>
        </div>
    </header>

    <main class="main-card">
        
        <nav class="tabs-container">
            <button class="tab-link active" onclick="abrirTab(event, 'tab-cadastro')">
                <i class="ph ph-plus-circle"></i>
                <span>Novo</span>
            </button>
            <button class="tab-link" onclick="abrirTab(event, 'tab-pesquisa')">
                <i class="ph ph-magnifying-glass"></i>
                <span>Buscar</span>
            </button>
            <button class="tab-link" onclick="abrirTab(event, 'tab-relatorio')">
                <i class="ph ph-calendar-check"></i>
                <span>Semana</span>
            </button>
        </nav>

        <div class="content-area">
            
<section id="tab-cadastro" class="tab-content active">
                <div class="section-header">
                    <h2>Novo Cadastro</h2>
                    <p>Preencha os dados do aniversariante.</p>
                </div>
                
                <form id="formCadastro">
                    <div class="input-group">
                        <label>Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="ph ph-user"></i>
                            <input type="text" name="nome" placeholder="Ex: Ana Silva" required>
                        </div>
                    </div>

                    <div class="row-2">
                        <div class="input-group">
                            <label>Nascimento</label>
                            <div class="input-wrapper">
                                <input type="date" name="data_nascimento" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Telefone</label>
                            <div class="input-wrapper">
                                <i class="ph ph-whatsapp-logo"></i>
                                <input type="tel" name="telefone" placeholder="(00) 00000-0000" maxlength="15">
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Endereço (Rua, Av, Nº)</label>
                        <div class="input-wrapper">
                            <i class="ph ph-map-pin"></i>
                            <input type="text" name="endereco" placeholder="Ex: Rua das Flores, 123">
                        </div>
                    </div>
                    
                    <div class="row-2">
                        <div class="input-group">
                            <label>Bairro</label>
                            <div class="input-wrapper">
                                <i class="ph ph-buildings"></i> <input type="text" name="bairro" placeholder="Ex: Centro">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>CEP</label>
                            <div class="input-wrapper">
                                <i class="ph ph-navigation-arrow"></i>
                                <input type="text" name="cep" placeholder="00000-000">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="ph-bold ph-check"></i> Salvar Cadastro
                    </button>
                </form>
            </section>

            <section id="tab-pesquisa" class="tab-content">
                <div class="section-header">
                    <h2>Encontrar Pessoas</h2>
                    <p>Busque por nome ou data específica.</p>
                </div>

                <div class="search-box">
                    <div class="input-group">
                        <label>Nome</label>
                        <div class="input-wrapper">
                            <i class="ph ph-magnifying-glass"></i>
                            <input type="text" id="nomePesquisa" placeholder="Digite um nome...">
                        </div>
                    </div>
                    
                    <div class="divider"><span>OU</span></div>

                    <div class="input-group">
                        <label>Data</label>
                        <div class="input-wrapper">
                            <input type="date" id="dataPesquisa">
                        </div>
                    </div>

                    <button class="btn-secondary" id="btnPesquisar">
                        Buscar Agora
                    </button>
                </div>
                
                <div class="resultado-container" id="resPesquisa">
                    <div class="empty-state">
                        <i class="ph-duotone ph-magnifying-glass"></i>
                        <p>Os resultados aparecerão aqui.</p>
                    </div>
                </div>
            </section>

            <section id="tab-relatorio" class="tab-content">
                <div class="section-header">
                    <h2>Próxima Semana</h2>
                    <p>Quem vai apagar as velinhas em breve?</p>
                </div>

                <div class="actions-row">
                    <button class="btn-secondary" id="btnRelatorio">
                        <i class="ph ph-arrows-clockwise"></i> Atualizar Tela
                    </button>
                    <button class="btn-accent" id="btnEnviarEmail">
                        <i class="ph ph-envelope-simple"></i> Enviar Email
                    </button>
                </div>
                
                <div class="resultado-container" id="resRelatorio">
                    </div>
            </section>

        </div>
    </main>

    <footer>
        <p>Desenvolvido com <i class="ph-fill ph-heart" style="color: #ef4444;"></i> e Café</p>
    </footer>
</div>

<script src="script.js"></script>

</body>
</html>
